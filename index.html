
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>City SC Utah | Roster Hub</title>

  <style>
    /* =========================
       GLOBAL STYLES
    ========================= */

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      background: #f4f6fb;
      color: #18274c;
    }

    /* =========================
       PAGE LAYOUT
    ========================= */

    .page {
      min-height: 100dvh;
      display: grid;
      place-items: center;
      padding: 24px;
    }

    /* =========================
       ROSTER HUB CARD
    ========================= */

    .hub {
      width: min(100%, 470px);
      background: linear-gradient(
        155deg,
        #172b58 0%,
        #263f77 60%,
        #d96743 145%
      );
      color: white;
      border-radius: 22px;
      padding: 38px 25px 34px;
      text-align: center;
      box-shadow: 0 14px 45px #192b552b;
    }

    /* =========================
       CLUB LOGO
    ========================= */

    .club-logo {
      width: 150px;
      height: auto;
      display: block;
      margin: 0 auto 20px;
    }

    /* =========================
       PAGE HEADING
    ========================= */

    .hub h1 {
      font-size: 29px;
      margin: 8px 0 4px;
    }

    .hub p {
      margin: 0 0 27px;
      color: #e9eefa;
    }

    /* =========================
       ROSTER BUTTONS
    ========================= */

    .links {
      display: grid;
      gap: 15px;
    }

    .links a {
      display: block;
      background: white;
      color: #192b55;
      border-radius: 99px;
      text-decoration: none;
      padding: 19px 12px;
      font-size: 17px;
      font-weight: 750;
      box-shadow: 0 4px 12px #07132d1c;
    }

    .links a:hover,
    .links a:focus-visible {
      background: #ffe6d4;
      outline: 3px solid #ffbd83;
      outline-offset: 2px;
    }

    /* =========================
       FOOTER
    ========================= */

    .foot {
      margin-top: 25px;
      font-size: 12px;
      color: #e5e9f4;
    }

    /* =========================
       MOBILE RESPONSIVENESS
    ========================= */

    @media (max-width: 420px) {
      .hub {
        padding: 32px 19px;
      }

      .hub h1 {
        font-size: 25px;
      }

      .links a {
        font-size: 16px;
      }
    }
  </style>
</head>

<body>

  <main class="page">

    <section class="hub">

      <!-- CLUB LOGO -->
      <img
        src="logo.png"
        alt="City SC Utah Logo"
        class="club-logo"
      >

      <!-- PAGE TITLE -->
      <h1>Girls Academy</h1>
      <p>Player Roster Hub</p>

      <!-- TEAM ROSTER LINKS -->
      <nav class="links" aria-label="Team rosters">

        <a href="rosters/u18-u19.html">
          U18 / U19 Girls Academy
        </a>

        <a href="rosters/u17.html">
          U17 Girls Academy
        </a>

        <a href="rosters/u16.html">
          U16 Girls Academy
        </a>

        <a href="rosters/u15.html">
          U15 Girls Academy
        </a>

      </nav>

      <!-- CLUB MOTTO -->
      <footer class="foot">
        To build great players and great people
      </footer>

    </section>

  </main>

</body>
</html>
