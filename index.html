<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>City SC Utah | Girls Academy</title><style>:root{font-family:system-ui,-apple-system,sans-serif;color:#18274c;background:#f4f6fb}*{box-sizing:border-box}body{margin:0}header{background:#192b55;color:white;padding:24px 18px;text-align:center}header h1{margin:0;font-size:clamp(28px,5vw,44px);letter-spacing:.04em}header p{margin:8px 0;color:#e9d5b6}.wrap{max-width:1080px;margin:auto;padding:22px 16px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.controls input,.controls select{font:inherit;padding:12px;border:1px solid #cbd3e2;border-radius:10px;background:white;min-width:140px;flex:1}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:white;border-radius:15px;overflow:hidden;box-shadow:0 4px 16px #1b31501a}.photo{height:190px;background:linear-gradient(145deg,#253d70,#7185ad);display:flex;align-items:center;justify-content:center;color:white;font-size:60px}.photo img{width:100%;height:100%;object-fit:cover}.info{padding:16px}.info h2{font-size:19px;margin:0 0 5px}.tag{display:inline-block;background:#f9e8e2;color:#ad443d;padding:4px 9px;border-radius:20px;font-size:12px;font-weight:700;margin:5px 0 10px}.info p{margin:5px 0;font-size:14px}footer{text-align:center;padding:28px;color:#5e6981;font-size:13px}.note{font-size:13px;color:#5e6981;margin:0 0 20px}@media(max-width:520px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:145px}.info{padding:11px}.info h2{font-size:15px}.info p{font-size:12px}.controls input{flex-basis:100%}}</style></head><body><header><h1>CITY SC UTAH</h1><p>GIRLS ACADEMY · U18 / U19</p><div>“To build great players and great people”</div></header><main class="wrap"><div class="controls"><input id="search" placeholder="Search player or school" aria-label="Search players"><select id="position" aria-label="Filter position" const grid=document.getElementById('grid');const search=document.getElementById('search'),position=document.getElementById('position'),year=document.getElementById('year');function render(){const q=search.value.toLowerCase();const found=PLAYERS.filter(p=>(p.name+' '+p.school+' '+p.number).toLowerCase().includes(q)&&(!position.value||p.position===position.value)&&(!year.value||String(p.year)===year.value));grid.replaceChildren();for(const p of found){const card=document.createElement('article');card.className='card';const photo=document.createElement('div');photo.className='photo';if(p.photo){const img=document.createElement('img');img.src=p.photo;img.alt=p.name;img.loading='lazy';photo.append(img)}else{photo.textContent='⚽'}const info=document.createElement('div');info.className='info';const name=document.createElement('h2');name.textContent=p.name;const tag=document.createElement('span');tag.className='tag';tag.textContent=p.position;const details=document.createElement('p');details.textContent=(p.number==null?'':'#'+p.number+' · ')+'Class of '+p.year;const school=document.createElement('p');school.textContent=p.school;info.append(name,tag,details,school);card.append(photo,info);grid.append(card)}if(!found.length){const msg=document.createElement('p');msg.textContent='No players match your filters.';grid.append(msg)}}[search,position,year].forEach(x=>x.addEventListener('input',render));render();</script></body></html>
