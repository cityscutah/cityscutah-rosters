
<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>City SC Utah | U18/U19 Girls Academy</title>

  <style>
    /* =========================
       GLOBAL STYLES
    ========================= */

    :root {
      font-family: system-ui, -apple-system, Arial, sans-serif;
      color: #18274c;
      background: #f4f6fb;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
    }

    /* =========================
       HEADER
    ========================= */

    header {
      background: #102d86;
      color: white;
      text-align: center;
      padding: 26px 16px;
    }

    header img {
      width: 112px;
      height: 112px;
      object-fit: contain;
    }

    header h1 {
      margin: 8px 0;
      font-size: clamp(26px, 5vw, 40px);
    }

    header p {
      margin: 5px 0;
      color: #ffe4a4;
    }

    .back {
      display: inline-block;
      margin-top: 14px;
      color: white;
      text-decoration: none;
      border: 1px solid #ffffff70;
      border-radius: 30px;
      padding: 9px 17px;
    }

    /* =========================
       MAIN CONTENT
    ========================= */

    .wrap {
      max-width: 1100px;
      margin: auto;
      padding: 24px 16px;
    }

    /* =========================
       SEARCH AND FILTERS
    ========================= */

    .controls {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-bottom: 20px;
    }

    .controls input,
    .controls select {
      font: inherit;
      min-width: 140px;
      flex: 1;
      padding: 12px;
      border: 1px solid #cbd3e2;
      border-radius: 10px;
      background: white;
    }

    /* =========================
       PLAYER GRID
    ========================= */

    .grid {
      display: grid;
      grid-template-columns: repeat(
        auto-fit,
        minmax(220px, 1fr)
      );
      gap: 16px;
    }

    /* =========================
       PLAYER CARDS
    ========================= */

    .card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 18px #172c501a;
    }

    /* Player Photos */

    .photo {
      height: 220px;
      background: linear-gradient(
        140deg,
        #12328b,
        #8294bd
      );
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 56px;
    }

    .photo img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center top;
    }

    /* Player Information */

    .info {
      padding: 15px;
    }

    .info h2 {
      font-size: 18px;
      margin: 0 0 6px;
    }

    .tag {
      display: inline-block;
      background: #ffebe0;
      color: #a84225;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      padding: 5px 9px;
      margin-bottom: 8px;
    }

    .info p {
      font-size: 14px;
      margin: 5px 0;
    }

    /* =========================
       FOOTER
    ========================= */

    footer {
      text-align: center;
      color: #64718c;
      padding: 28px 12px;
    }

    /* =========================
       MOBILE RESPONSIVENESS
    ========================= */

    @media (max-width: 540px) {

      .grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 10px;
      }

      .photo {
        height: 160px;
      }

      .info {
        padding: 11px;
      }

      .info h2 {
        font-size: 15px;
      }

      .info p {
        font-size: 12px;
      }

      .controls input {
        flex-basis: 100%;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       HEADER
  ========================= -->

  <header>

    <img
      src="../logo.png"
      alt="City SC Utah logo"
      onerror="this.style.display='none'"
    >

    <h1>CITY SC UTAH</h1>

    <p>GIRLS ACADEMY · U18 / U19</p>

    <div>
      To build great players and great people
    </div>

    <a class="back" href="../index.html">
      ← Back to All Rosters
    </a>

  </header>

  <!-- =========================
       MAIN ROSTER SECTION
  ========================= -->

  <main class="wrap">

    <!-- SEARCH AND FILTERS -->

    <div class="controls">

      <input
        id="search"
        type="search"
        placeholder="Search player or school"
        aria-label="Search player or school"
      >

      <select id="position" aria-label="Filter position">
        <option value="">All positions</option>
        <option>Goalkeeper</option>
        <option>Defender</option>
        <option>Midfielder</option>
        <option>Forward</option>
      </select>

      <select id="year" aria-label="Filter graduation year">
        <option value="">All graduation years</option>
        <option>2027</option>
        <option>2028</option>
      </select>

    </div>

    <!-- PLAYER CARDS GENERATED BY JAVASCRIPT -->

    <div id="grid" class="grid"></div>

  </main>

  <!-- =========================
       FOOTER
  ========================= -->

  <footer>
    City SC Utah Girls Academy · Player directory
  </footer>

  <!-- =========================
       JAVASCRIPT
  ========================= -->

    ========================= */

      },

      // DEFENDERS

      {

        photo: '../images/evelyn.jpg'
      },

      {

        school: 'Herriman High School',
        photo: '../images/bella.jpg'
      },

      {

        number: 8,
        position: 'Defender',
        year: 2027,
        school: 'Brighton High School',
        photo: '../images/addison-despain.jpg'
      },

      {
        name: 'Brylee Newport',
        number: 11,
        position: 'Defender',
        year: 2027,
        school: 'Juan Diego High School',
        photo: '../images/brylee.jpg'
      },

      {
        name: 'Samantha Raiford',
        number: null,
        position: 'Defender',
        year: 2028,
        school: 'Mountain Ridge High School',
        photo: '../images/samantha.jpg'
      },

      // MIDFIELDERS

      {
        name: 'Juniper Bales',
        number: 6,
        position: 'Midfielder',
        year: 2027,
        school: 'Park City High School',
        photo: '../images/juniper.jpg'
      },

      {
        name: 'Paige Proctor',
        number: 7,

        year: 2027,
        school: 'Olympus High School',
        photo: '../images/paige.jpg'
      },

      {
        name: 'Emmy Mulligan',
        number: 20,
        position: 'Midfielder',

      },

      {
        name: 'Sophia Agrapides',
        number: 22,

        year: 2028,
        school: 'Corner Canyon High School',
        photo: '../images/sophia.jpg'
      },

      {
        name: 'London Pace',
        number: 24,
        position: 'Midfielder',
        year: 2027,
        school: 'Bingham High School',
        photo: '../images/london.jpg'
      },

      // FORWARDS

      {
        name: 'Lily Pearce',
        number: 13,
        position: 'Forward',
        year: 2027,
        school: 'Corner Canyon High School',
        photo: '../images/lily.jpg'
      },

      {
        name: 'Ellie Tilt',
        number: 16,
        position: 'Forward',
        year: 2027,
        school: 'Alta High School',
        photo: '../images/ellie.jpg'
      },

      {
        name: 'Addison Bowers',
        number: 18,
        position: 'Forward',
        year: 2027,
        school: 'Park City High School',
        photo: '../images/addison-bowers.jpg'
      },

      {
        name: 'Mikelle Walker',
        number: 28,
        position: 'Forward',
        year: 2027,
        school: 'Bingham High School',
        photo: '../images/mikelle.jpg'
      }

    ];

    /* =========================
       GET PAGE ELEMENTS
    ========================= */

    const grid = document.getElementById('grid');
    const search = document.getElementById('search');
    const position = document.getElementById('position');
    const year = document.getElementById('year');

    /* =========================
       RENDER PLAYER CARDS
    ========================= */

    function render() {

      const q = search.value.trim().toLowerCase();

      // Filter players

      const filtered = PLAYERS.filter(p => {

        const matchesSearch = (
          p.name + ' ' +
          p.school + ' ' +
          (p.number ?? '')
        ).toLowerCase().includes(q);

        const matchesPosition =
          !position.value ||
          p.position === position.value;

        const matchesYear =
          !year.value ||
          String(p.year) === year.value;

        return (
          matchesSearch &&
          matchesPosition &&
          matchesYear
        );

      });

      // Clear previous cards

      grid.replaceChildren();

      // Create player cards

      for (const p of filtered) {

        const card = document.createElement('article');
        card.className = 'card';

        /* PLAYER PHOTO */

        const photo = document.createElement('div');
        photo.className = 'photo';

        const fallback = () => {
          photo.replaceChildren();
          photo.textContent = '⚽';
        };

        if (p.photo) {

          const img = document.createElement('img');

          img.src = p.photo;
          img.alt = 'Photo of ' + p.name;
          img.loading = 'lazy';
          img.onerror = fallback;

          photo.append(img);

        } else {
          fallback();
        }

        /* PLAYER INFORMATION */

        const info = document.createElement('div');
        info.className = 'info';

        const name = document.createElement('h2');
        name.textContent = p.name;

        const tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = p.position;

        const details = document.createElement('p');

        details.textContent =
          (p.number == null ? '' : '#' + p.number + ' · ') +
          'Class of ' + p.year;

        const school = document.createElement('p');
        school.textContent = p.school;

        /* ASSEMBLE CARD */

        info.append(name, tag, details, school);
        card.append(photo, info);
        grid.append(card);

      }

      /* NO SEARCH RESULTS */

      if (!filtered.length) {

        const msg = document.createElement('p');

        msg.textContent =
          'No players match your filters.';

        grid.append(msg);

      }

    }

    /* =========================
       SEARCH AND FILTER EVENTS
    ========================= */

    [search, position, year].forEach(el => {
      el.addEventListener('input', render);
    });

    /* =========================
       INITIAL PAGE LOAD
    ========================= */

    render();

  </script>

</body>
</html>
