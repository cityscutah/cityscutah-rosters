<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>City SC Utah | U18/U19 Girls Academy</title>
<style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#18274c;background:#f4f6fb}
*{box-sizing:border-box}body{margin:0}header{background:#102d86;color:white;text-align:center;padding:26px 16px}header img{width:112px;height:112px;object-fit:contain}header h1{margin:8px 0;font-size:clamp(26px,5vw,40px)}header p{margin:5px 0;color:#ffe4a4}.back{display:inline-block;margin-top:14px;color:white;text-decoration:none;border:1px solid #ffffff70;border-radius:30px;padding:9px 17px}.wrap{max-width:1100px;margin:auto;padding:24px 16px}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px}.controls input,.controls select{font:inherit;min-width:140px;flex:1;padding:12px;border:1px solid #cbd3e2;border-radius:10px;background:white}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.card{background:white;border-radius:16px;overflow:hidden;box-shadow:0 4px 18px #172c501a}.photo{height:220px;background:linear-gradient(140deg,#12328b,#8294bd);display:flex;align-items:center;justify-content:center;color:white;font-size:56px}.photo img{width:100%;height:100%;object-fit:cover;object-position:center top}.info{padding:15px}.info h2{font-size:18px;margin:0 0 6px}.tag{display:inline-block;background:#ffebe0;color:#a84225;border-radius:20px;font-size:12px;font-weight:700;padding:5px 9px;margin-bottom:8px}.info p{font-size:14px;margin:5px 0}footer{text-align:center;color:#64718c;padding:28px 12px}@media(max-width:540px){.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.photo{height:160px}.info{padding:11px}.info h2{font-size:15px}.info p{font-size:12px}.controls input{flex-basis:100%}}
</style>
</head>
<body>
<header>
<img src="../logo.png" alt="City SC Utah logo" onerror="this.style.display='none'">
<h1>CITY SC UTAH</h1>
<p>GIRLS ACADEMY · U18 / U19</p>
<div>To build great players and great people</div>
<a class="back" href="../index.html">← Back to All Rosters</a>
</header>
<main class="wrap">
<div class="controls">
<input id="search" type="search" placeholder="Search player or school" aria-label="Search player or school">
<select id="position" aria-label="Filter position"><option value="">All positions</option><option>Goalkeeper</option><option>Defender</option><option>Midfielder</option><option>Forward</option></select>
<select id="year" aria-label="Filter graduation year"><option value="">All graduation years</option><option>2027</option><option>2028</option></select>
</div>
<div id="grid" class="grid"></div>
</main>
<footer>City SC Utah Girls Academy · Player directory</footer>
<script>
// Edit each player's photo filename here. Pictures are in the main images/ folder.
// Only publish player information and photos approved for public use.
const PLAYERS = [
{name:'McKinley Stowell',number:1,position:'Goalkeeper',year:2027,school:'Mountain Ridge High School',photo:'../images/mckinley.jpg'},
{name:'Evelyn Woolley',number:3,position:'Defender',year:2027,school:'Alta High School',photo:'../images/evelyn.jpg'},
{name:'Bella Ziegenbusch',number:4,position:'Defender',year:2028,school:'Herriman High School',photo:'../images/bella.jpg'},
{name:'Juniper Bales',number:6,position:'Midfielder',year:2027,school:'Park City High School',photo:'../images/juniper.jpg'},
{name:'Paige Proctor',number:7,position:'Midfielder',year:2027,school:'Olympus High School',photo:'../images/paige.jpg'},
{name:'Addison Despain',number:8,position:'Defender',year:2027,school:'Brighton High School',photo:'../images/addison-despain.jpg'},
{name:'Brylee Newport',number:11,position:'Defender',year:2027,school:'Juan Diego High School',photo:'../images/brylee.jpg'},
{name:'Lily Pearce',number:13,position:'Forward',year:2027,school:'Corner Canyon High School',photo:'../images/lily.jpg'},
{name:'Ellie Tilt',number:16,position:'Forward',year:2027,school:'Alta High School',photo:'../images/ellie.jpg'},
{name:'Addison Bowers',number:18,position:'Forward',year:2027,school:'Park City High School',photo:'../images/addison-bowers.jpg'},
{name:'Emmy Mulligan',number:20,position:'Midfielder',year:2027,school:'Olympus High School',photo:'../images/emmy.jpg'},
{name:'Sophia Agrapides',number:22,position:'Midfielder',year:2028,school:'Corner Canyon High School',photo:'../images/sophia.jpg'},
{name:'London Pace',number:24,position:'Midfielder',year:2027,school:'Bingham High School',photo:'../images/london.jpg'},
{name:'Mikelle Walker',number:28,position:'Forward',year:2027,school:'Bingham High School',photo:'../images/mikelle.jpg'},
{name:'Maizey Miller',number:55,position:'Goalkeeper',year:2027,school:'East High School',photo:'../images/maizey.jpg'},
{name:'Samantha Raiford',number:null,position:'Defender',year:2028,school:'Mountain Ridge High School',photo:'../images/samantha.jpg'}
];
const grid=document.getElementById('grid');
const search=document.getElementById('search');
const position=document.getElementById('position');
const year=document.getElementById('year');
function render(){
 const q=search.value.trim().toLowerCase();
 const filtered=PLAYERS.filter(p=>(p.name+' '+p.school+' '+(p.number??'')).toLowerCase().includes(q)&&(!position.value||p.position===position.value)&&(!year.value||String(p.year)===year.value));
 grid.replaceChildren();
 for(const p of filtered){
  const card=document.createElement('article');card.className='card';
  const photo=document.createElement('div');photo.className='photo';
  const fallback=()=>{photo.replaceChildren();photo.textContent='⚽';};
  if(p.photo){const img=document.createElement('img');img.src=p.photo;img.alt='Photo of '+p.name;img.loading='lazy';img.onerror=fallback;photo.append(img);}else fallback();
  const info=document.createElement('div');info.className='info';
  const name=document.createElement('h2');name.textContent=p.name;
  const tag=document.createElement('span');tag.className='tag';tag.textContent=p.position;
  const details=document.createElement('p');details.textContent=(p.number==null?'':'#'+p.number+' · ')+'Class of '+p.year;
  const school=document.createElement('p');school.textContent=p.school;
  info.append(name,tag,details,school);card.append(photo,info);grid.append(card);
 }
 if(!filtered.length){const msg=document.createElement('p');msg.textContent='No players match your filters.';grid.append(msg);}
}
[search,position,year].forEach(el=>el.addEventListener('input',render));render();
</script>
</body>
</html>
