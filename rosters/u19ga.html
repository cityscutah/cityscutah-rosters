const groups={GK:['GK'],DEF:['OB','CB','FB','DEF'],MID:['MID','CDM'],FWD:['FWD','W']};
const grid=document.getElementById('grid'),count=document.getElementById('count');
const search=document.getElementById('search'),jersey=document.getElementById('jersey'),position=document.getElementById('position'),year=document.getElementById('year');
function render(){
 const q=search.value.trim().toLowerCase(),n=jersey.value.trim(),pos=position.value,y=year.value;
 const result=PLAYERS.filter(p=>(p.name+' '+p.school).toLowerCase().includes(q)&&(!n||String(p.number)===n)&&(!y||String(p.year)===y)&&(!pos||p.position.split(', ').some(t=>groups[pos].includes(t))));
 grid.replaceChildren();count.textContent=`Showing ${result.length} of ${PLAYERS.length} players`;
 for(const p of result){
  const card=document.createElement('article');card.className='card';
  const portrait=document.createElement('div');portrait.className='portrait';
  const img=document.createElement('img');img.src=p.photo;img.alt=`Portrait of ${p.name}`;img.loading='lazy';img.onerror=()=>{img.style.display='none'};
  const num=document.createElement('span');num.className='number';num.textContent=p.number==null?'—':'#'+p.number;portrait.append(img,num);
  const info=document.createElement('div');info.className='info';
  const name=document.createElement('h3');name.textContent=p.name;
  const tag=document.createElement('span');tag.className='position';tag.textContent=p.position;
  const details=document.createElement('div');details.className='details';
  const grad=document.createElement('span');grad.textContent='Class of '+p.year;
  const gpa=document.createElement('span');gpa.textContent='GPA '+p.gpa;
  const school=document.createElement('p');school.className='school';school.textContent=p.school;
  const email=document.createElement('a');email.className='email';email.href='mailto:'+p.email;email.textContent=p.email;
  details.append(grad,gpa);info.append(name,tag,details,school,email);card.append(portrait,info);grid.append(card);
 }
 if(!result.length){const empty=document.createElement('p');empty.textContent='No players match your search.';grid.append(empty)}
}
[search,jersey,position,year].forEach(el=>el.addEventListener('input',render));render();
